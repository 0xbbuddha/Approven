name: Release

# A release is cut by pushing a version tag, and named after it:
#   git tag -a v0.2.0 -m "..." && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: |
          mkdir -p dist-bin
          go build -trimpath -o dist-bin/approved ./cmd/approved
          go build -trimpath -o dist-bin/approve-helper ./cmd/approve-helper
          go build -trimpath -o dist-bin/approve-cli ./cmd/approve-cli
          cp dist/approved.service dist/pam-line.txt dist/install.sh dist/uninstall.sh dist-bin/
          tar -C dist-bin -czf approven-linux-amd64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: approven-linux-amd64.tar.gz

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest runners already ship an Android SDK with licenses
      # accepted; android-actions/setup-android@v3 tries to install the
      # long-removed legacy "tools" package and fails, so we skip it.
      - working-directory: android
        env:
          APPROVEN_KEYSTORE_B64: ${{ secrets.APPROVEN_KEYSTORE_B64 }}
          APPROVEN_KEYSTORE_PASSWORD: ${{ secrets.APPROVEN_KEYSTORE_PASSWORD }}
          # The app reports the tag as its version; the run number keeps every release's versionCode higher.
          APPROVEN_VERSION: ${{ github.ref_name }}
          APPROVEN_VERSION_CODE: ${{ github.run_number }}
        run: |
          # Refuse to publish an unsigned (or differently signed) APK.
          test -n "$APPROVEN_KEYSTORE_B64" || { echo "APPROVEN_KEYSTORE_B64 secret is missing"; exit 1; }
          export APPROVEN_KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$APPROVEN_KEYSTORE_B64" | base64 -d > "$APPROVEN_KEYSTORE"
          ./gradlew assembleRelease --console=plain
          rm -f "$APPROVEN_KEYSTORE"
      - run: cp android/app/build/outputs/apk/release/app-release.apk approven.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: approven.apk

  build-pkg:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - run: |
          pacman -Syu --noconfirm --needed go git sudo
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      # The PKGBUILD clones the repo itself: pin it to this tag, or it would
      # build whatever main is at by then (and the published copy would too).
      - run: sed -i 's|git+${url}.git"|git+${url}.git#tag=${{ github.ref_name }}"|' PKGBUILD
      - run: sudo -u builder makepkg -f --noconfirm
        env:
          HOME: /home/builder
      - uses: actions/upload-artifact@v4
        with:
          name: arch-pkg
          path: |
            PKGBUILD
            *.pkg.tar.zst

  release:
    needs: [build-go, build-apk, build-pkg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mkdir -p out
          cp artifacts/linux-bin/approven-linux-amd64.tar.gz out/
          cp artifacts/apk/approven.apk out/
          cp artifacts/arch-pkg/PKGBUILD out/
          cp artifacts/arch-pkg/*.pkg.tar.zst out/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
